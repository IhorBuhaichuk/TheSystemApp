name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle workspace
        run: |
          chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Run architecture and Compose guards
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.ihor.thesystem.quality.*GuardTest"

      - name: Run Room guards
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests "com.ihor.thesystem.data.local.room.database.RoomSchemaGuardTest" \
            --tests "com.ihor.thesystem.data.local.room.database.DatabasePopulatorGuardTest" \
            --tests "com.ihor.thesystem.data.local.room.database.DatabasePopulatorCoreMetadataTest" \
            --tests "com.ihor.thesystem.data.local.room.database.WorkoutAnalyticsQueryGuardTest"

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Compile release bundle
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml

      - name: Upload unsigned release bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-bundle
          if-no-files-found: warn
          path: app/build/outputs/bundle/release/*.aab
